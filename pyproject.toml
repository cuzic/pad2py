[project]
name = "pad2py"
version = "0.1.0"
description = "Power Automate Desktop flow to pywinauto/pyautogui Python converter"
requires-python = ">=3.10"
dependencies = [
    "pywinauto>=0.6.8",
    "comtypes>=1.4.0",
    "mss>=9.0.0",
    "pywin32>=306; sys_platform == 'win32'",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jsonschema>=4.23.0",
    "psutil>=6.0.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.13",
    "httpx>=0.27.0",
    "lark>=1.3.1",
    "cryptography>=50.0.2",
    "pyzipper>=0.4.0",
    "python-dateutil>=3.0.0",
    "lxml>=6.1.3",
    "pyperclip>=1.11.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pypdf>=6.21.4",
    "pdfplumber>=0.11.10",
]

[project.scripts]
pad2py = "dump_daemon.pad2py_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pywinrm>=0.5.0",
    "reportlab>=5.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dump_daemon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
