[project]
name = "pad2py"
version = "0.1.0"
description = "Power Automate Desktop flow to pywinauto/pyautogui Python converter"
requires-python = ">=3.10"
dependencies = [
    "pywinauto>=0.6.8",
    "comtypes>=1.4.0",
    "mss>=9.0.0",
    "pywin32>=306; sys_platform == 'win32'",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jsonschema>=4.23.0",
    "psutil>=6.0.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.13",
    "httpx>=0.27.0",
    "lark>=1.3.1",
    "cryptography>=50.0.2",
    "pyzipper>=0.4.0",
    "python-dateutil>=3.0.0",
    "lxml>=6.1.3",
    "pyperclip>=1.11.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pypdf>=6.21.4",
    "pdfplumber>=0.11.10",
    "requests>=2.34.2",
]

[project.optional-dependencies]
# 知見209: 生成されたPythonコードが参照するが、本体の`dependencies`には
# 含めない「プラグイン」依存群。活動の生成コードが特定のサードパーティ
# ライブラリを要求する場合(例: `ExportPDFPageAsImage`のPDFページ
# ラスタライズ)、全ユーザーに強制せず、必要な利用者だけ
# `pip install pad2py[pdf-render]`のように明示的に選べるようにする。
# pad2py本体(トランスパイラ自身)はこれらを一切importしない——
# `uipath_codegen`はこれらのライブラリ呼び出しを文字列として生成
# するだけで、コード生成そのものに実行時のimportは不要(`pypdf`/
# `openpyxl`と同じ既存の設計)。テストでの`exec()`検証用に`dev`
# グループにも同じパッケージを追加する(無い場合は
# `pytest.importorskip`で該当テストのみ自動skip)。
pdf-render = ["pymupdf>=1.24.0"]

[project.scripts]
pad2py = "dump_daemon.pad2py_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pywinrm>=0.5.0",
    "reportlab>=5.1.0",
    "pymupdf>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dump_daemon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
